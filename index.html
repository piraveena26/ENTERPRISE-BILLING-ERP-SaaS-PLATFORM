    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enterprise Billing & ERP SaaS Platform</title>
    <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono for financial clarity -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Clean modern CSS reset without any external .css files -->
    <style>
      *, ::before, ::after {
        box-sizing: border-box;
      }
      button, input, optgroup, select, textarea {
        font-family: inherit;
        font-size: 100%;
        color: inherit;
        background-color: transparent;
      }
      button {
        cursor: pointer;
        border: none;
        outline: none;
        padding: 0;
        margin: 0;
      }
      /* Sleek modern minimalist scrollbars */
      ::-webkit-scrollbar {
        width: 5px;
        height: 5px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(148, 163, 184, 0.25);
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(148, 163, 184, 0.5);
      }
    </style>
  </head>
  <body class="bg-slate-50 dark:bg-[#070b14] text-slate-900 dark:text-slate-100 antialiased selection:bg-indigo-500 selection:text-white" style="font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; margin: 0; padding: 0;">
